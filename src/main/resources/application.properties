spring.application.name=sellammal

cloud.api.url=https://energymonitoring.raisondigital.com/device/ingest

# ---- Modbus TCP (PLC) ----
# PLC map numbering: 40000 -> offset 0 (verified on site 12-Nov-2026)
modbus.address-base=40000
# PLC stores floats word-swapped (CDAB), verified on site 12-Nov-2026
modbus.word-order=CDAB
# FLOAT32 / INT32 / UINT32
modbus.data-type=FLOAT32
modbus.unit-id=1
modbus.use-slave-id-as-unit-id=false
# connect + response timeout per request (ms)
modbus.timeout-ms=3000

# ---- Per-meter scaling (deviceId) ----
# Power House EB holds kW values in watts
meter.18.kw-scale=0.001

# ---- Packing machine (on Huller PLC) -> separate packing API ----
packing.enabled=true
# Poll interval (ms). A record is sent only when the bag count changes.
packing.poll-ms=1000
# Packing API on AWS. Leave empty to only read + log (no upload).
packing.api.url=https://sellammal.raisondigital.com/api/packing/ingest
# Optional: must match PACKING_API_KEY on the cloud packing app
packing.api.key=
# TODO confirm deviceId with the packing API
packing.device-id=23
# Timezone for dateTime and batchId
packing.zone=Asia/Kolkata
packing.plc-ip=192.168.1.1
packing.set-weight-address=41390
packing.totalizer-address=41398
packing.bag-count-address=41400
# FLOAT32 / INT32 / UINT32 (2 registers) or INT16 / UINT16 (1 register)
packing.set-weight-type=FLOAT32
packing.totalizer-type=FLOAT32
packing.bag-count-type=FLOAT32
# New batch when set weight changes; ignore set weight 0 (idle / cleared HMI)
packing.ignore-zero-set-weight=true
