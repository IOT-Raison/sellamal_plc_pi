spring.application.name=sellammal

cloud.api.url=https://energymonitoring.raisondigital.com/device/ingest

# ---- Modbus TCP (PLC) ----
# PLC map numbering: 40000 -> offset 0 (verified on site 12-Nov-2026)
modbus.address-base=40000
# PLC stores floats word-swapped (CDAB), verified on site 12-Nov-2026
modbus.word-order=CDAB
# FLOAT32 / INT32 / UINT32
modbus.data-type=FLOAT32
modbus.unit-id=1
modbus.use-slave-id-as-unit-id=false
# connect + response timeout per request (ms)
modbus.timeout-ms=3000

# ---- Per-meter scaling (deviceId) ----
# Power House EB holds kW values in watts
meter.18.kw-scale=0.001
